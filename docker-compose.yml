services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VoltClause
      - ENVIRONMENT=production
      - PRIMARY_MODEL=gpt-4o-mini
      - FALLBACK_MODEL=mock-cea-expert
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/voltclause
      - LLM_TIMEOUT_SECONDS=15.0
      - LLM_MAX_RETRIES=2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=voltclause
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voltclause"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
